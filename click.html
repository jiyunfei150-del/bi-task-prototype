<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>定时任务交互原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e6e9f1;--fg:#151a2d;--mute:#767d95;--line:#e2e5ef;--line2:#edeff5;--soft:#f6f7fb;--acc:#3b4cd4;--accs:#eceefc;--acc2:#c7cdf6;--pin:#c2255c;--red:#cf342c;--ok:#14874a;--org:#c0620a;--paper:#fff;--app:#f2f4f9}
body{background:var(--bg);color:var(--fg);font:13px/1.5 Inter,'Noto Sans SC',system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
button,input,textarea{font:inherit;color:inherit}
table{font-size:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.pt{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:18px;text-wrap:balance}
.ph .mu{color:var(--mute)}
.ph .sp{margin-left:auto;display:flex;gap:8px}
.tg{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.tg .sw{background:#c9cdd9}.tg.on .sw{background:var(--acc)}.tg.on .sw::after{left:auto;right:2px}
.pw{display:grid;grid-template-columns:190px minmax(0,1fr) 300px;gap:14px;align-items:start}
.pn{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px}
.pn .h{font-size:11px;letter-spacing:.06em;color:var(--mute);padding:6px 10px}
.pn button{padding:8px 10px;border-radius:8px;color:#454c66}
.pn button:hover{background:var(--soft)}
.pn button.on{background:var(--accs);color:var(--acc);font-weight:600}
.sw0{min-width:0}
.pa{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:14px}
.pa h2{margin:0;font-size:16px}
.pa .lead{margin:0;color:var(--mute);line-height:1.6}
.pa .ai{display:flex;gap:10px;line-height:1.55}
.pa .ai p{margin:0}
.pa .ai small{display:block;color:var(--mute);font-size:12px}
.pa .off{color:var(--mute)}
@media (max-width:1180px){.pw{grid-template-columns:minmax(0,1fr)}.pn{flex-direction:row;flex-wrap:wrap}.pn .h{display:none}.pa{position:static}}

/* product screen */
.screen{width:1180px;height:780px;background:var(--app);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 30px rgba(13,24,80,.12)}
.top{height:44px;flex:none;background:#0d1850;color:#c3cbf0;display:flex;align-items:center;gap:22px;padding:0 18px}
.top b{color:#fff;font-size:15px;margin-right:8px}.top .on{color:#fff;font-weight:600}.top .me{margin-left:auto}
.bx{flex:1;display:flex;min-height:0}
.side{width:150px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;color:#454c66}
.side .it{padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:6px}
.side .it.sb{padding-left:22px}
.side .it.on{background:var(--accs);color:var(--acc);font-weight:600}
.side button.it:hover{background:#f3f4fa}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.mu{color:var(--mute)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:#454c66;background:#fff;white-space:nowrap}
button.chip:hover{border-color:var(--acc2)}
.chip.on{border-color:var(--acc2);background:var(--accs);color:var(--acc);font-weight:600}
.chip.xs{height:20px;font-size:11px;padding:0 7px}
.chip.okc{background:#e8f5ee;border-color:#bfe3cd;color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#454c66;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--acc2)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:#2f3fbf}
.dis{opacity:.45;cursor:not-allowed}
.lk{color:var(--acc);font-size:12.5px}
.lk:hover{text-decoration:underline}
.ic{width:22px;height:22px;border-radius:6px;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.ic:hover{background:var(--soft);color:var(--fg)}
.new{display:inline-flex;height:16px;padding:0 5px;border-radius:4px;background:var(--acc);color:#fff;font-size:10px;align-items:center;font-weight:500}
.n{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--pin);color:#fff;font-size:10.5px;font-weight:700;font-style:normal;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 3px rgba(194,37,92,.18);vertical-align:middle;line-height:1}
.ok{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;align-items:center;justify-content:center;flex:none}
.av{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;flex:none}
.sw{display:inline-flex;width:30px;height:17px;border-radius:999px;background:var(--acc);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff}
.sw.off{background:#c9cdd9}.sw.off::after{right:auto;left:2px}
.swr{display:inline-flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:5px 13px;border-right:1px solid var(--line);font-size:12.5px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.seg button:not(.on):hover{background:var(--soft)}
.inp{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;box-sizing:border-box;outline:none}
.inp:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;line-height:1.6;background:#151a2d;color:#d7dcf2;border-radius:8px;padding:9px 11px;white-space:pre;overflow:auto;border:0;box-sizing:border-box}
.code u{text-decoration:none;color:#ffd38a}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--acc2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#151a2d;color:#fff;padding:9px 16px;border-radius:9px;font-size:12.5px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap}

/* home */
.hm{flex:1;margin:14px;display:flex;flex-direction:column;align-items:center;padding:16px 24px;overflow:auto}
.hmt{align-self:stretch;display:flex;justify-content:flex-end;gap:8px;align-items:center;color:var(--mute)}
.hm h1{margin:110px 0 8px;font-size:28px}
.hm>p{margin:0}
.ib{margin-top:24px;width:720px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.ib.on{border-color:var(--acc2);box-shadow:0 0 0 4px var(--accs)}
.ib textarea{border:0;resize:none;outline:none;font-size:14px;line-height:1.6;background:transparent;box-shadow:none!important}
.ib .ibr{display:flex;gap:8px;align-items:center}
.send{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.out{width:720px;margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--mute)}
.ex{width:720px;margin-top:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.exc{padding:13px 14px;display:flex;flex-direction:column;gap:5px;position:relative;text-align:left}
.exc:hover{border-color:var(--acc2);box-shadow:0 4px 14px rgba(59,76,212,.08)}
.exc span{color:var(--mute);line-height:1.55}
.exc .n{position:absolute;right:-7px;top:-7px}

/* chat */
.chat{flex:1;display:flex;min-height:0;margin:12px}
.chatl{width:370px;flex:none;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;min-height:0}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.ub{align-self:flex-end;max-width:300px;background:var(--accs);padding:10px 12px;border-radius:12px;display:flex;flex-direction:column;gap:8px;line-height:1.6;white-space:pre-wrap}
.as{display:flex;gap:8px;align-items:flex-start}
.asb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;line-height:1.65}
.stp{background:var(--soft);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.stp>div{display:flex;gap:8px;align-items:flex-start}
.stp .ok{margin-top:2px}
.cc{flex:1;min-width:0;background:#fff;border:1px solid var(--acc2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:0 0 0 3px var(--accs)}
.cch{display:flex;gap:8px;align-items:center}
.stn{font-size:12px;color:var(--acc)}
.cf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cd{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center}
.cd .lk{margin-left:auto}
.tps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12px;position:relative;background:#fff}
.tp:hover{border-color:var(--acc2)}
.tp.on{border-color:var(--acc);background:var(--accs)}
.tp .rec{position:absolute;right:6px;top:6px;font-size:10px;color:#fff;background:var(--acc);border-radius:4px;padding:0 5px}
.tp .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.rcm{position:relative}
.dd{position:absolute;left:0;top:30px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(13,24,80,.14);padding:6px;z-index:20;display:flex;flex-direction:column;min-width:170px}
.dd button{padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:10px}
.dd button:hover{background:var(--soft)}
.warn{color:var(--org);font-size:12px}
.cin{border-top:1px solid var(--line2);padding:12px 14px}
.cin div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:#a6abbf}
.rp{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:0 12px 12px 0;display:flex;flex-direction:column;min-height:0}
.rh{padding:11px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line2)}
.rh b{font-size:15px}
.tabs{padding:0 16px;display:flex;gap:20px;border-bottom:1px solid var(--line2);align-items:center}
.tabs button{padding:9px 0;border-bottom:2px solid transparent;color:var(--mute)}
.tabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
.rb{flex:1;min-height:0;overflow:auto;background:var(--soft);padding:16px}
.pvb{display:flex;gap:18px;align-items:flex-start}
.kvs{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr);gap:9px 10px;line-height:1.55}
.kv>span:nth-child(odd){color:var(--mute)}
.setb{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.mon{display:flex;flex-direction:column;gap:12px}
.msec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.msec>b,.mhd b{font-size:14px;font-weight:600}
.msec .mu{font-size:12px;line-height:1.5}
.mhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mhd>div:first-child{flex:1;min-width:0}
.mhd>.row{flex:none;flex-wrap:nowrap}
.replay{background:#fdf1e3;color:var(--org);border-radius:8px;padding:8px 12px}
.replay.none{background:#e8f5ee;color:var(--ok)}
.replay b{font-size:15px;margin:0 3px}
.hits{display:flex;flex-direction:column;gap:6px}
.hits>div{display:grid;grid-template-columns:44px 78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 12px;border-radius:8px;background:var(--soft)}
.hits .lo{color:var(--red);font-weight:600}.hits .hi{color:var(--org);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mgrid .swr{text-align:left;align-items:flex-start;line-height:1.35}
.fr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:start}
.fr:last-child{border-bottom:0}
.fr>label{color:#454c66;font-weight:500;display:flex;gap:6px;align-items:center;padding-top:4px}
.hit{color:var(--red);font-weight:600}
.miss{color:#454c66}
.wd{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.wd.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.wd.add{border-style:dashed;color:var(--acc);align-items:center}
.wh{display:flex;gap:8px;align-items:center}
.load{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mute);gap:6px}

/* phone & lark card */
.phone{width:290px;flex:none;border:9px solid #1d2233;border-radius:32px;background:#eef0f5;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box}
.fsb{background:#fff;padding:9px 11px;display:flex;gap:6px;align-items:center;font-weight:600;font-size:12px;border-bottom:1px solid var(--line)}
.ptag{display:inline-flex;height:17px;padding:0 6px;border-radius:4px;background:var(--accs);color:var(--acc);font-size:10px;align-items:center;font-weight:500}
.pscr{flex:1;overflow:auto;padding:9px;display:flex;flex-direction:column;gap:8px}
.pt0{text-align:center;font-size:10.5px;color:var(--mute)}
.fc{background:#fff;border-radius:10px;overflow:hidden;font-size:11.5px;line-height:1.55;flex:none}
.fh{padding:9px 11px;color:#fff;display:flex;flex-direction:column;gap:1px}
.fh small{font-size:10.5px;opacity:.92}
.fb{padding:9px 11px;display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--soft);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column}
.kpi span{color:var(--mute);font-size:10.5px}
.kpi b{font-size:15px}
.kpi b.sm{font-size:12px;padding-top:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{display:inline-flex;height:25px;padding:0 9px;border-radius:6px;border:1px solid #d9dce6;align-items:center;font-size:11px;background:#fff}
.b:hover{border-color:#3370ff;color:#3370ff}
.b.p{background:#3370ff;border-color:#3370ff;color:#fff}
.b.p:hover{color:#fff;background:#245bdb}
.ft{border-top:1px solid var(--line2);padding-top:6px;font-size:10px;color:#8b91a7}
.cond{background:#fcebea;color:var(--red);border-radius:6px;padding:7px 8px}
.empty{background:#fff;border:1.5px dashed #c9cdd9;border-radius:10px;padding:26px 14px;text-align:center;display:flex;flex-direction:column;gap:4px;color:#454c66}
.spark{width:100%;display:block}
.fb table{border-collapse:collapse;width:100%}
.fb td,.fb th{padding:3px 3px;text-align:right;border-bottom:1px solid var(--line2);font-weight:400}
.fb th{color:var(--mute)}
.fb td:first-child,.fb th:first-child{text-align:left}
.dn{color:var(--red)}

/* tasks */
.tk{flex:1;min-height:0;padding:14px;display:flex;flex-direction:column;gap:10px}
.notice{display:flex;gap:8px;align-items:center;background:#eef1fd;border:1px solid #d5dbf8;border-radius:10px;padding:8px 12px;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:10px 14px;display:flex;flex-direction:column;gap:1px;text-align:left}
.stat:hover{border-color:var(--acc2)}
.stat.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.stat b{font-size:22px}
.stat.fix{border-color:#f2c98a;background:#fffaf1}
.lst{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lbar{display:flex;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tw{flex:1;overflow:auto}
.tt{border-collapse:collapse;width:100%;font-size:12.5px}
.tt th{text-align:left;color:var(--mute);font-weight:500;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
.tt td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.5}
.tt td .sub{display:block;color:var(--mute);font-size:11.5px}
.tt tr.wn td{background:#fff8ec}
.tt tr.of td{color:#a6abbf}
.tt tr.hl td{animation:hl 2.4s ease-out}
@keyframes hl{0%,40%{background:#eef1fd}100%{background:transparent}}
.ops{display:flex;gap:10px;align-items:center;white-space:nowrap;position:relative}
.ops .lk{font-size:12.5px}
.tg2{display:inline-flex;height:20px;padding:0 7px;border-radius:5px;font-size:11px;align-items:center;white-space:nowrap}
.t-push{background:#e7efff;color:#2a5bd7}.t-sub{background:#f0eafc;color:#6b3fc4}.t-rule{background:#fcebea;color:#cf342c}.t-smart{background:#fdf0e1;color:#c0620a}
.s-ok{color:var(--ok)}.s-hit{color:var(--red)}.s-alert,.s-warn{color:var(--org)}.s-off,.s-none,.s-normal{color:var(--mute)}
.menu{position:absolute;right:0;top:22px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(13,24,80,.14);padding:5px;z-index:15;display:flex;flex-direction:column;min-width:110px}
.menu button{padding:6px 10px;border-radius:6px;color:#454c66}
.menu button:hover{background:var(--soft)}
.drw{position:absolute;right:0;top:44px;bottom:0;width:380px;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(13,24,80,.12);z-index:25;display:flex;flex-direction:column}
.drw .dh{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.drw .db{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--soft)}
.err{background:#fcebea;color:var(--red);border-radius:8px;padding:8px 10px;align-self:stretch}

/* modal */
.ov{position:absolute;inset:44px 0 0;background:rgba(13,24,80,.32);display:flex;align-items:center;justify-content:center;z-index:30}
.mdl{width:1020px;height:700px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(13,24,80,.25)}
.mh{padding:13px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.mb{flex:1;display:flex;min-height:0}
.mf{flex:1;min-width:0;padding:6px 20px;overflow:auto}
.mf .fr{grid-template-columns:84px minmax(0,1fr)}
.mpv{width:330px;flex:none;background:var(--soft);border-left:1px solid var(--line2);padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;overflow:auto}
.mft{padding:11px 20px;border-top:1px solid var(--line2);display:flex;gap:10px;align-items:center}
.tp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tp.dis{opacity:.4;cursor:not-allowed}

/* cards page & intro */

 const ok=x=>freq==='day'||(freq==='workday'&&x.getDay()>0&&x.getDay()<6)||(freq==='mon'&&x.getDay()===1)||(freq==='fri'&&x.getDay()===5)||(freq==='month'&&x.getDate()===1);
 while(out.length<n&&g++<500){if(d>NOW&&ok(d))out.push(new Date(d));d.setDate(d.getDate()+1)}return out}

  return `<div class="fc">${h('#d83931','⚠ '+esc(o.name),'常规监控 · 条件命中 · 业务日期 11-16')}<div class="fb"><div class="cond"><b>条件：${condT(o)}</b><div>实际：${val}，${CMPL[o.cmp]} ${v}%</div></div>${tb}<div class="mu">近 14 天 ${o.metric}</div>${trend}${btns([['追问原因','已在问数里打开：为什么 '+o.metric+' 跌了'],['今天别再提醒','好的，这条任务今天不再提醒'],['改阈值','已打开任务设置 · 规则']])}${ft(o)}</div></div>`}
 if(o.type==='sub')return `<div class="fc">${h('#7c4dd6',esc(o.name),'问题订阅 · 重新分析 · 业务日期 11-16')}<div class="fb"><div>昨天 DAU 52,310（-12.4%），付费 49.7 万（-3.1%）；降幅主要来自华为渠道。</div><div class="kpis k3"><div class="kpi"><span>DAU</span><b>52,310</b></div><div class="kpi"><span>付费</span><b>49.7万</b></div><div class="kpi"><span>付费率</span><b>4.6%</b></div></div>${trend.replace('stroke="#cf342c" stroke-dasharray','stroke="transparent" stroke-dasharray')}${btns([['展开分析','','mp'],['追问','已在问数里接着这次分析追问']])}${ft(o)}</div></div>`;
 // push

function base30(k){const W=640,H=228,L=38,R=632,Tp=24,Bt=200,n=D30.length;
 const lo=B30.map(v=>v-k*SIG),hi=B30.map(v=>v+k*SIG);
 const mn=Math.floor(Math.min(...lo,...A30)/5000)*5000,mx=Math.ceil(Math.max(...hi,...A30)/5000)*5000;
 const X=i=>L+(R-L)*i/(n-1),Y=v=>Bt-(Bt-Tp)*(v-mn)/(mx-mn),P=a=>a.map((v,i)=>[X(i),Y(v)]),pt=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
 const sm=p=>{let d='';for(let i=0;i<p.length-1;i++){const a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],e=p[Math.min(p.length-1,i+2)];d+=`C${pt([b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6])} ${pt([c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6])} ${pt(c)}`}return d};

 let g='';for(let v=mn;v<=mx;v+=5000){const y=Y(v);g+=`<line x1="${L}" x2="${R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#edeff5"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${v/1000}k</text>`}
 let xl='';for(let i=0;i<n;i+=5)xl+=`<text x="${X(i).toFixed(1)}" y="${Bt+17}" text-anchor="middle">${D30[i]}</text>`;

 const m2=document.getElementById('msgs');if(m2){if(S.sc){m2.scrollTop=m2.scrollHeight;S.sc=0}else if(keep!=null)m2.scrollTop=keep}
 if(fid&&fid!=='sendBtn'){const n=document.getElementById(fid);if(n){n.focus();try{if(ss!=null)n.setSelectionRange(ss,se)}catch(_){}}}
 fit()}
function fit(){const w=document.getElementById('sw').clientWidth;document.getElementById('screen').style.zoom=Math.min(1,w/1180)}
window.addEventListener('resize',fit);

function classify(t){if(/select\s/i.test(t))return 'push';if(/(跌|涨|降|升)(超|过|破)|%|阈值|低于|高于/.test(t))return 'rule';if(/盯|监控|异常|提醒|告警/.test(t))return 'smart';return 'sub'}
function send(){const t=S.text.trim();if(!t)return;let k=S.exk&&S.text===PRE[S.exk].text?S.exk:classify(t);
 if(!S.tag&&!/(每天|每日|每周|每月|每小时|点|定时|提醒|盯|监控|异常|发到)/.test(t)){toast('原型只演示定时任务：试试加上“每天 9 点发给我”');return}
 startFlow(k,t,!S.tag)}
function openModal(t){if(!t){S.modal=mDefault();return}const M=mDefault();Object.assign(M,{edit:t.id,src:t.type==='sub'?'q':'sql',ran:true,type:t.type,style:t.style||'table',thr:t.thr||10,sens:t.sens||'mid',freq:t.freq,at:t.at,rcpt:new Set(t.rcpt),name:t.name,q:t.name});S.modal=M}
function runTask(t){if(!t.on){toast('任务已停用，先打开启用开关');return}
 t.today=true;const o=tOpts(t);
 if(t.needFix){t.last={k:'warn',t:'需要处理',s:'SQL 仍报错，本次改为重新分析'};S.drawer={id:t.id,mode:'card'};toast('SQL 仍报错，已按任务名重新分析并发送');return}
 if(t.type==='rule'&&!ruleHit(o)){t.last={k:'normal',t:'未命中 · 刚刚',s:`${CMPL[o.cmp]} ${ruleV(o)}%，未发送`};toast('已运行：没命中条件，这次不发');return}
 t.last=t.type==='push'?{k:'ok',t:'已发送 · 刚刚',s:t.legacy?'按原样发送 · '+t.legacy:o.style==='bi'?'摘要卡 + 移动端页面':'表格卡'}:t.type==='sub'?{k:'ok',t:'已发送 · 刚刚',s:'重新分析 · 轻 BI'}:t.type==='rule'?{k:'hit',t:'命中 · 刚刚',s:`${CMPL[o.cmp]} ${ruleV(o)}%`}:{k:'alert',t:'告警 · 刚刚',s:'DAU 低于正常范围'};
 S.drawer={id:t.id,mode:'card'};toast('已发到 '+rcLab(t.rcpt))}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');
 if(!el){if(S.menu||S.rcOpen){S.menu=null;S.rcOpen=false;render()}return}
 if(el.classList.contains('dis')){const a0=el.dataset.act;
  if(a0==='mcreate'){const M=S.modal;toast(M.src==='sql'&&!M.ran?'先点「试跑」，通过了才能创建':!M.rcpt.size?'至少选一个接收人':'有群还没拉机器人')}
  else if(a0==='create')toast(S.flow.rcpt.size?'有群还没拉机器人，先点「一键拉机器人」':'至少选一个接收人');
  else if(a0==='send')toast('先输入内容，或点下面的示例');
  else if(a0==='dsave')toast('先试跑通过再保存');
  else if(a0==='mtype')toast('这个类型需要换一种内容来源');
  render();return}
 const a=el.dataset.act,v=el.dataset.v,f=S.flow,M=S.modal;
 if(a!=='menu'&&!(el.closest('.menu')))S.menu=null;
 if(a!=='rcadd'&&a!=='rcpick')S.rcOpen=false;
 const tk=()=>S.tasks.find(t=>t.id===+v);
 if(['nav','go','gotasks','run','dclose','edit','newt','view','ex','send'].includes(a))S.mp=false;
 switch(a){
 case 'ann':S.ann=!S.ann;break;
 case 'reset':init();toast('已重置');break;
 case 'nav':S.drawer=null;S.modal=null;S.del=null;
  if(v.startsWith('chat:')){S.tag=true;startFlow(v.slice(5))}else if(v==='modal'){S.page='tasks';openModal()}else{S.page=v;clearTimeout(timer)}break;
 case 'go':S.page=v;S.drawer=null;S.modal=null;clearTimeout(timer);break;
 case 'tag':S.tag=!S.tag;break;
 case 'ex':S.text=PRE[v].text;S.exk=v;S.tag=true;break;
 case 'send':send();break;
 case 'next':f.stage++;S.sc=1;break;
 case 'back':f.stage=+v;S.sc=1;break;
 case 'freq':f.freq=v;break;
 case 'at':f.at=v;break;
 case 'type':f.type=v;f.tsw=false;if(v==='smart')f.tab='set';break;
 case 'tsw':f.tsw=!f.tsw;break;
 case 'thrset':f.thr=+v;break;
 case 'mp':S.mp=v==='1';break;
 case 'fmig':S.f.mig=!S.f.mig;break;
 case 'fscope':S.f.scope=v;S.f.stat=null;break;
 case 'view':S.drawer={id:+v,mode:'view'};break;
 case 'unsub':S.tasks=S.tasks.filter(t=>t.id!==+v);toast('已不再接收，任务本身不受影响');break;
 case 'upg':{const t=tk();t.legacy0=t.legacy;t.legacy=null;t.style='bi';t.last={k:t.last.k,t:t.last.t,s:'已换成新版 · 摘要卡 + 移动端页面'};S.menu=null;toast('已换成新版呈现，下次发送生效；⋯ 里可以换回');break}
 case 'dng':{const t=tk();t.legacy=t.legacy0;t.legacy0=null;t.last={k:t.last.k,t:t.last.t,s:'按原样发送 · '+t.legacy};S.menu=null;toast('已换回原来的发送方式');break}
 case 'rc':f.rcpt.has(v)?f.rcpt.delete(v):f.rcpt.add(v);break;
 case 'rcadd':S.rcOpen=!S.rcOpen;break;
 case 'rcpick':f.rcpt.add(v);S.rcOpen=false;break;
 case 'bot':BOT[v]=1;toast('已把「智能问数助手」拉进 '+RC[v]);break;
 case 'test':toast('测试卡片已发给你（不计入运行记录）');break;
 case 'create':f.created=true;f.stage=4;S.sc=1;S.tasks.unshift({id:++S.nid,name:f.name,proj:'波克棋牌',src:'问数创建',type:f.type,freq:f.freq,at:f.at,rcpt:[...f.rcpt],on:true,isNew:true,today:false,flow:f,last:{k:'none',t:'还没运行',s:'下次 '+fmtS(nextRuns(f.freq,f.at,1)[0])}});toast('任务已创建，已加到「定时任务」列表');break;
 case 'chtype':f.type=v;f.tab='set';toast('已改成'+T[v].n+'，右侧可以调设置');break;
 case 'gotasks':{const t=S.tasks.find(x=>x.flow===f);S.page='tasks';S.hl=t&&t.id;S.f={type:'all',stat:null,proj:'all',q:''};clearTimeout(timer);setTimeout(()=>{S.hl=null},2600);break}
 case 'tab':f.tab=v;break;
 case 'sens':f.sens=v;break;
 case 'smet':{if(f.mets[v]&&Object.values(f.mets).filter(Boolean).length===1){toast('至少盯一个指标');break}f.mets[v]=f.mets[v]?0:1;break}
 case 'so':f.so[v]=f.so[v]?0:1;break;
 case 'bl':f.bl=v;break;
 case 'hol':f.hol=f.hol?0:1;break;
 case 'dim':f.dims[v]=f.dims[v]?0:1;break;
 case 'metric':f.metric=v;break;
 case 'cmp':f.cmp=v;break;
 case 'dir':f.dir=v;break;
 case 'thr':f.thr=Math.max(1,Math.min(99,f.thr+(+v)));break;
 case 'miss':f.miss=v;break;
 case 'style':f.style=v;break;
 case 'concl':{const c=f.comps.find(c=>c.id==='concl');c.on=!c.on;break}
 case 'sql':f.sqlOpen=f.sqlOpen===v?null:v;break;
 case 'sqlrun':toast('试跑通过');break;
 case 'mv':{const i=+v,j=i+(+el.dataset.d);if(j>=0&&j<f.comps.length){const c=f.comps;[c[i],c[j]]=[c[j],c[i]]}break}
 case 'addc':f.kc++;f.comps.push({id:'kpi'+f.kc,name:'DAU 指标卡',kind:'指标卡 · 你的 SQL',kpi:true});toast('已加一个指标卡，可以上下移动');break;
 case 'rmc':f.comps.splice(+v,1);break;
 case 'cbtn':toast(el.dataset.msg);break;
 case 'notice':S.notice=false;break;
 case 'stat':S.f.stat=S.f.stat===v?null:v;break;
 case 'ftype':S.f.type=v;break;
 case 'fproj':S.f.proj=v;break;
 case 'clearf':S.f={type:'all',stat:null,proj:'all',q:''};break;
 case 'sw':{const t=tk();t.on=!t.on;t.last=t.on?{k:'none',t:'已启用',s:'下次 '+fmtS(nextRuns(t.freq,t.at,1)[0])}:{k:'off',t:'已停用 · 刚刚',s:''};toast(t.on?'已启用':'已停用，不会再发送');break}
 case 'run':runTask(tk());break;
 case 'edit':{const t=tk();if(t.flow){S.flow=t.flow;S.page='chat';S.flow.tab='set';S.sc=1}else openModal(t);break}
 case 'fix':S.drawer={id:+v,mode:'sql',fixed:false,ran:false};break;
 case 'menu':S.menu=S.menu===+v?null:+v;break;
 case 'mcopy':{const t=tk();const c=Object.assign({},t,{id:++S.nid,name:t.name+' 副本',on:false,isNew:true,flow:null,mo:t.flow?fOpts(t.flow):t.mo,last:{k:'off',t:'已停用',s:'复制出来默认停用'}});S.tasks.splice(S.tasks.indexOf(t)+1,0,c);toast('已复制，默认停用');break}
 case 'mdel':S.del=+v;break;
 case 'delno':S.del=null;break;
 case 'delok':S.tasks=S.tasks.filter(t=>t.id!==+v);S.del=null;toast('已删除');break;
 case 'dclose':S.drawer=null;break;
 case 'dfix':S.drawer.fixed=true;break;
 case 'drun':if(!S.drawer.fixed){toast('试跑失败：Unknown column \'pay_amount\'')}else{S.drawer.ran=true}break;
 case 'dsave':{const t=S.tasks.find(x=>x.id===S.drawer.id);t.needFix=false;t.last={k:'ok',t:'已修复 · 刚刚',s:'下次按 SQL 正常执行'};S.drawer=null;toast('已保存，下次按 SQL 正常执行');break}
 case 'newt':openModal();break;
 case 'mclose':S.modal=null;break;
 case 'msrc':M.src=v;{const allow=v==='sql'?['push','rule','smart']:['sub','rule','smart'];if(!allow.includes(M.type))M.type=allow[0]}break;
 case 'mtype':{const AN={push:'付费渠道周报',sub:'昨日大盘简报',rule:'DAU 跌超 '+M.thr+'% 提醒',smart:'DAU 智能监控'};if(!M.edit&&(!M.name||Object.values(AN).includes(M.name)||/^DAU 跌超/.test(M.name)))M.name=AN[v];M.type=v;break}
 case 'mstyle':M.style=v;break;
 case 'mthr':M.thr=Math.max(1,Math.min(99,M.thr+(+v)));break;
 case 'msens':M.sens=v;break;
 case 'mfreq':M.freq=v;break;
 case 'mat':M.at=v;break;
 case 'mrc':M.rcpt.has(v)?M.rcpt.delete(v):M.rcpt.add(v);break;
 case 'mrun':M.ran=true;break;
 case 'mtest':toast('测试卡片已发给你（不计入运行记录）');break;
 case 'mcreate':{const o={name:M.name||'未命名任务',type:M.type,freq:M.freq,at:M.at,rcpt:[...M.rcpt],style:M.style,thr:M.thr,sens:M.sens,data:M.src==='sql'?'pay':'dau'};
  if(M.edit){const t=S.tasks.find(x=>x.id===M.edit);Object.assign(t,o);S.hl=t.id;toast('已保存')}
  else{const t=Object.assign({id:++S.nid,proj:'波克棋牌',src:'手动创建',on:true,isNew:true,today:false,last:{k:'none',t:'还没运行',s:'下次 '+fmtS(nextRuns(M.freq,M.at,1)[0])}},o);S.tasks.unshift(t);S.hl=t.id;S.f={type:'all',stat:null,proj:'all',q:''};toast('任务已创建')}
  setTimeout(()=>{S.hl=null},2600);S.modal=null;break}
 case 'cv':S.cv[el.dataset.k]=v;break;
 }
 render()});
document.addEventListener('input',e=>{const id=e.target.id,v=e.target.value;
 if(id==='homeText'){S.text=v;const b=document.getElementById('sendBtn');if(b)b.classList.toggle('dis',!v.trim());return}
 if(id==='q'){S.f.q=v.trim();render();return}
 if(id==='thr'){const n=parseInt(v,10);if(!isNaN(n)){S.flow.thr=Math.max(1,Math.min(99,n));render()}return}
 if(id==='mName'){S.modal.name=v;render();return}
 if(id==='mSql'){S.modal.sql=v;S.modal.ran=false;render();return}
 if(id==='mQ'){S.modal.q=v;render();return}});
document.addEventListener('keydown',e=>{if(e.target.id==='homeText'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();render()}});
init();render();
</script>
